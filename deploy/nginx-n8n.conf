# Sustituye pedidos.example.com por el dominio real.
# Esta plantilla presupone que Certbot ya creó el certificado TLS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pedidos.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pedidos.example.com;

    ssl_certificate /etc/letsencrypt/live/pedidos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedidos.example.com/privkey.pem;

    client_max_body_size 50m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Único webhook público hasta conectar y verificar Meta.
    location = /webhook/orders/intake {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    # No expone aprobación, resumen ni otros webhooks internos.
    location ~ ^/webhook(?:-waiting)?/ {
        return 404;
    }

    location = /operator {
        return 301 /operator/;
    }

    # Panel de pedidos protegido por la misma autenticación de administración.
    location ^~ /operator/ {
        auth_basic "Pedidos";
        auth_basic_user_file /etc/nginx/.htpasswd-n8n;

        proxy_pass http://127.0.0.1:5680/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /operator;
        proxy_set_header X-Operator-User $remote_user;
        proxy_buffering off;
    }

    # Segunda barrera para la interfaz y las APIs administrativas de n8n.
    location / {
        auth_basic "n8n";
        auth_basic_user_file /etc/nginx/.htpasswd-n8n;

        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
