services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Define MARIADB_DATABASE en .env.production}
      MARIADB_USER: ${MARIADB_USER:?Define MARIADB_USER en .env.production}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Define MARIADB_PASSWORD en .env.production}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env.production}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations/002_catalog_conversations.sql:/docker-entrypoint-initdb.d/002_catalog_conversations.sql:ro
      - ./db/migrations/003_roles_locations.sql:/docker-entrypoint-initdb.d/003_roles_locations.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.31.5
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_DOMAIN:?Define N8N_DOMAIN en .env.production}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en .env.production}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      GENERIC_TIMEZONE: ${TZ:-Europe/Madrid}
      TZ: ${TZ:-Europe/Madrid}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workspace/n8n:ro
      - ./scripts:/workspace/scripts:ro
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - backend

  operator:
    build:
      context: ./operator
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      OPERATOR_ADMIN_NAME: ${OPERATOR_ADMIN_NAME:-Admin}
      OPERATOR_ADMIN_EMAIL: ${OPERATOR_ADMIN_EMAIL:?Define OPERATOR_ADMIN_EMAIL en .env.production}
      OPERATOR_ADMIN_PASSWORD: ${OPERATOR_ADMIN_PASSWORD:?Define OPERATOR_ADMIN_PASSWORD en .env.production}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "127.0.0.1:5680:80"
    volumes:
      - ./operator/uploads:/var/www/html/uploads
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === \"ok\\n\" ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mariadb_data:
  n8n_data:
